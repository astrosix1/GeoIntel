<!DOCTYPE html>
<html>
<head>
<title>Test API Connection</title>
<style>
body { font-family: monospace; background: #222; color: #0f0; padding: 20px; }
.good { color: #0f0; }
.bad { color: #f00; }
</style>
</head>
<body>

<h2>Testing GeoIntel API Connection</h2>
<div id="output"></div>

<script src="../../../frontend-api.js"></script>
<script>
// Escape untrusted strings before interpolating into innerHTML (same
// pattern used by the live app's escapeHtml — c.title/c.country come
// straight from the API response).
const ESCAPE_MAP = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ESCAPE_MAP[ch]);
}

async function test() {
  const out = document.getElementById('output');

  out.innerHTML += '<p>1. Testing health check...</p>';
  try {
    const health = await GeoIntelAPI.healthCheck();
    if (health.status === 'ok') {
      out.innerHTML += '<p class="good">[OK] Backend is running</p>';
    } else {
      out.innerHTML += '<p class="bad">[FAIL] Health check failed</p>';
      return;
    }
  } catch (e) {
    out.innerHTML += `<p class="bad">[ERROR] ${escapeHtml(e.message)}</p>`;
    return;
  }

  out.innerHTML += '<p>2. Fetching crises...</p>';
  try {
    const result = await GeoIntelAPI.getCrises({ days: 365 });
    if (result.error) {
      out.innerHTML += `<p class="bad">[ERROR] ${escapeHtml(result.error)}</p>`;
    } else {
      out.innerHTML += `<p class="good">[OK] Got ${result.crises.length} crises</p>`;
      result.crises.slice(0, 3).forEach(c => {
        out.innerHTML += `<p>&nbsp;&nbsp;- ${escapeHtml(c.title)} (${escapeHtml(c.country)}, severity: ${c.severity})</p>`;
      });
    }
  } catch (e) {
    out.innerHTML += `<p class="bad">[ERROR] ${escapeHtml(e.message)}</p>`;
  }
}

test();
</script>

</body>
</html>
